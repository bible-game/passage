name: release
on:
  workflow_call:
jobs:
  release:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Set-up Java ☕
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21
      - name: Set-up Gradle 🔨
        uses: gradle/actions/setup-gradle@v6
      - name: Set-up Git 🐵
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
      - name: Release Version and Tag 🏷️
        env:
          GIT_ACTOR: ${{ github.actor }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(./gradlew -q printTagVersion)"
          sed -i "s/^version=.*/version=$VERSION/" gradle.properties
          ./gradlew build
          git commit -am "[release] passage-$VERSION"
          git tag "$VERSION" -m "[release] passage-$VERSION"
          git push origin HEAD "$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        # Note :: -SNAPSHOT is only stripped here; the next one is added to develop by step-bump
      - name: Release 📦
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}